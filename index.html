<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/icon.ico" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <link
      rel="alternate"
      type="application/rss+xml"
      title="ALemonX 更新"
      href="/rss.xml"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f3f1ec" />
    <script>
      ;(() => {
        let saved
        try {
          saved = localStorage.getItem('theme')
        } catch {}
        const dark =
          saved === 'dark' ||
          (saved !== 'light' &&
            matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.add(dark ? 'dark' : 'light')
        document.querySelector('meta[name="theme-color"]').content = dark
          ? '#1b1916'
          : '#f3f1ec'
      })()
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="description"
      content="使用 ALemonX 创建或导入项目，运行命令，管理进程，并批准 Agent 任务。"
    />
    <meta property="og:title" content="ALemonX · 创建、运行和管理项目" />
    <meta
      property="og:description"
      content="导入代码库，运行命令，查看日志，创建并批准 Agent 任务。"
    />
    <meta property="og:image" content="https://alemonjs.dev/og.png" />
    <meta property="og:image:alt" content="ALemonX Local Agent Workstation" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>ALemonX · 创建、运行和管理项目</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
