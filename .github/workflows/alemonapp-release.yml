name: Publish ALemonAPP APK

on:
  push:
    tags:
      - 'app-v*'

permissions:
  contents: write

concurrency:
  group: app-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Download and publish APK
    runs-on: ubuntu-24.04

    steps:
      - name: Resolve tag and download address
        id: release
        shell: bash
        env:
          CONFIGURED_UPDATE_BASE_URL: ${{ vars.ALEMONAPP_UPDATE_BASE_URL }}
          CONFIGURED_APK_SHA256: ${{ vars.ALEMONAPP_APK_SHA256 }}
        run: |
          set -euo pipefail

          tag_name="${GITHUB_REF_NAME}"
          if [[ ! "$tag_name" =~ ^app-v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must match app-vMAJOR.MINOR.PATCH, received: $tag_name" >&2
            exit 1
          fi

          update_base_url="${CONFIGURED_UPDATE_BASE_URL:-https://download.alemonjs.com/application/alemonapp}"
          update_base_url="${update_base_url%/}"
          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"
          echo "update_base_url=$update_base_url" >> "$GITHUB_OUTPUT"

          if [[ -n "$CONFIGURED_APK_SHA256" ]]; then
            echo "apk_sha256=$CONFIGURED_APK_SHA256" >> "$GITHUB_OUTPUT"
          fi

      - name: Download release files from update address
        env:
          UPDATE_BASE_URL: ${{ steps.release.outputs.update_base_url }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          for file_name in \
            output-metadata.json \
            latest.json \
            app-universal-release.apk \
            app-arm64-v8a-release.apk; do
            echo "Downloading $file_name"
            curl --fail --location --retry 5 --retry-delay 3 \
              --connect-timeout 20 --max-time 900 \
              "$UPDATE_BASE_URL/$file_name" \
              -o "artifacts/$file_name"
            test -s "artifacts/$file_name"
            file "artifacts/$file_name"
          done

          jq empty artifacts/output-metadata.json
          jq empty artifacts/latest.json

      - name: Verify APK checksum
        if: ${{ steps.release.outputs.apk_sha256 != '' }}
        env:
          APK_SHA256: ${{ steps.release.outputs.apk_sha256 }}
        run: |
          set -euo pipefail
          echo "$APK_SHA256  artifacts/app-universal-release.apk" | sha256sum --check

      - name: Publish GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" \
              artifacts/output-metadata.json \
              artifacts/latest.json \
              artifacts/app-universal-release.apk \
              artifacts/app-arm64-v8a-release.apk \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$TAG_NAME" \
              artifacts/output-metadata.json \
              artifacts/latest.json \
              artifacts/app-universal-release.apk \
              artifacts/app-arm64-v8a-release.apk \
              --repo "$GITHUB_REPOSITORY" \
              --title "ALemonAPP $TAG_NAME" \
              --generate-notes
          fi
