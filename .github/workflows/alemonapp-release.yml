name: Publish ALemonAPP Release

on:
  push:
    tags:
      - 'app-v*'

permissions:
  contents: write

concurrency:
  group: app-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  download:
    name: Download ${{ matrix.file }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        file:
          - output-metadata.json
          - latest.json
          - app-universal-release.apk
          - app-arm64-v8a-release.apk

    steps:
      - name: Download release file
        shell: bash
        env:
          UPDATE_BASE_URL: ${{ vars.ALEMONAPP_UPDATE_BASE_URL }}
          APK_SHA256: ${{ vars.ALEMONAPP_APK_SHA256 }}
          FILE_NAME: ${{ matrix.file }}
        run: |
          set -euo pipefail

          tag_name="${GITHUB_REF_NAME}"
          if [[ ! "$tag_name" =~ ^app-v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must match app-vMAJOR.MINOR.PATCH, received: $tag_name" >&2
            exit 1
          fi

          update_base_url="${UPDATE_BASE_URL:-https://download.alemonjs.com/application/alemonapp}"
          update_base_url="${update_base_url%/}"
          mkdir -p artifacts

          curl --fail --location --retry 5 --retry-delay 3 \
            --connect-timeout 20 --max-time 900 \
            "$update_base_url/$FILE_NAME" \
            -o "artifacts/$FILE_NAME"

          test -s "artifacts/$FILE_NAME"
          file "artifacts/$FILE_NAME"

          if [[ "$FILE_NAME" == "output-metadata.json" || "$FILE_NAME" == "latest.json" ]]; then
            jq empty "artifacts/$FILE_NAME"
          fi

          if [[ "$FILE_NAME" == "app-universal-release.apk" && -n "$APK_SHA256" ]]; then
            echo "$APK_SHA256  artifacts/$FILE_NAME" | sha256sum --check
          fi

      - name: Store downloaded file
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.file }}
          path: artifacts/${{ matrix.file }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs: download
    runs-on: ubuntu-24.04

    steps:
      - name: Collect downloaded files
        uses: actions/download-artifact@v4
        with:
          pattern: app-*
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test -s artifacts/output-metadata.json
          test -s artifacts/latest.json
          test -s artifacts/app-universal-release.apk
          test -s artifacts/app-arm64-v8a-release.apk

          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" \
              artifacts/output-metadata.json \
              artifacts/latest.json \
              artifacts/app-universal-release.apk \
              artifacts/app-arm64-v8a-release.apk \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$TAG_NAME" \
              artifacts/output-metadata.json \
              artifacts/latest.json \
              artifacts/app-universal-release.apk \
              artifacts/app-arm64-v8a-release.apk \
              --repo "$GITHUB_REPOSITORY" \
              --title "ALemonAPP $TAG_NAME" \
              --generate-notes
          fi
